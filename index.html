<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hemraj Electricals - Billing App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f4f4f4; color: #333; }
        
        /* Login Screen */
        #loginBox { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #2d2d2d; }
        .login-card { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 360px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center; }
        .login-card h2 { color: #b30000; margin-bottom: 8px; }
        .login-card p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; margin-bottom: 5px; color: #444; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; outline: none; }
        .login-btn { width: 100%; padding: 12px; background: #b30000; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .error-msg { color: red; margin-top: 10px; font-size: 14px; display: none; }

        /* Billing App Screen */
        #billingApp { display: none; padding: 15px; max-width: 800px; margin: 0 auto; background: white; min-height: 100vh; }
        .shop-header { text-align: center; border-bottom: 2px solid #b30000; padding-bottom: 10px; margin-bottom: 15px; }
        .shop-header h1 { color: #b30000; font-size: 22px; }
        .shop-header p { font-size: 13px; color: #555; }
        
        .customer-details { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; background: #f9f9f9; padding: 10px; border-radius: 6px; }
        .customer-details input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; width: 100%; }

        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 13px; }
        th { background-color: #b30000; color: white; }
        input.table-input { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; font-weight: bold; }
        .btn-add { background: #28a745; color: white; width: 100%; margin-bottom: 15px; }
        .btn-print { background: #007bff; color: white; width: 100%; }
        .btn-delete { background: #dc3545; color: white; padding: 5px 8px; }

        .total-section { text-align: right; font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #b30000; }

        @media print {
            body { background: white; }
            #loginBox, .btn-add, .btn-print, .btn-delete, .no-print { display: none !important; }
            #billingApp { display: block !important; padding: 0; width: 100%; }
            input { border: none; background: transparent; }
        }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="loginBox">
        <div class="login-card">
            <h2>Hemraj Electricals</h2>
            <p>Please login to access billing</p>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="usernameInput" placeholder="Enter username" required autocomplete="off">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="passwordInput" placeholder="Enter password" required>
                </div>
                <button type="submit" class="login-btn">Login</button>
                <div id="errorText" class="error-msg">युजरनेम किंवा पासवर्ड चुकीचा आहे!</div>
            </form>
        </div>
    </div>

    <!-- Main Billing App -->
    <div id="billingApp">
        <div class="shop-header">
            <h1>HEMRAJ ELECTRICALS</h1>
            <p>A/P. Phondaghat | All Kinds of Electrical Goods & Wiring Materials</p>
        </div>

        <div class="customer-details">
            <input type="text" id="custName" placeholder="ग्राहकाचे नाव (Customer Name)">
            <input type="text" id="custPhone" placeholder="मोबाईल नंबर (Phone Number)">
        </div>

        <table>
            <thead>
                <tr>
                    <th>अ.नं.</th>
                    <th>तपशील (Item)</th>
                    <th>नग (Qty)</th>
                    <th>दर (Rate)</th>
                    <th>एकूण (Total)</th>
                    <th class="no-print">कृती</th>
                </tr>
            </thead>
            <tbody id="billItems">
                <tr>
                    <td>1</td>
                    <td><input type="text" class="table-input" placeholder="सामानाचे नाव"></td>
                    <td><input type="number" class="table-input qty" value="1" oninput="calculateTotal()"></td>
                    <td><input type="number" class="table-input rate" value="0" oninput="calculateTotal()"></td>
                    <td class="item-total">0</td>
                    <td class="no-print"><button class="btn btn-delete" onclick="deleteRow(this)">X</button></td>
                </tr>
            </tbody>
        </table>

        <button class="btn btn-add no-print" onclick="addRow()">+ नवीन ओळ जोडा (Add Item)</button>

        <div class="total-section">
            एकूण रक्कम (Grand Total): ₹ <span id="grandTotal">0</span>
        </div>

        <button class="btn btn-print no-print" onclick="window.print()">बिल प्रिंट करा / PDF सेव्ह करा (Print Bill)</button>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            var user = document.getElementById('usernameInput').value.trim();
            var pass = document.getElementById('passwordInput').value.trim();
            var errorDiv = document.getElementById('errorText');

            if (user === "HE" && pass === "HemrajEle") {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('billingApp').style.display = 'block';
            } else {
                errorDiv.style.display = 'block';
            }
        }

        function addRow() {
            var table = document.getElementById('billItems');
            var rowCount = table.rows.length + 1;
            var row = table.insertRow();
            row.innerHTML = `
                <td>${rowCount}</td>
                <td><input type="text" class="table-input" placeholder="सामानाचे नाव"></td>
                <td><input type="number" class="table-input qty" value="1" oninput="calculateTotal()"></td>
                <td><input type="number" class="table-input rate" value="0" oninput="calculateTotal()"></td>
                <td class="item-total">0</td>
                <td class="no-print"><button class="btn btn-delete" onclick="deleteRow(this)">X</button></td>
            `;
            updateRowNumbers();
        }

        function deleteRow(btn) {
            var row = btn.parentNode.parentNode;
            row.parentNode.removeChild(row);
            updateRowNumbers();
            calculateTotal();
        }

        function updateRowNumbers() {
            var table = document.getElementById('billItems');
            for (var i = 0; i < table.rows.length; i++) {
                table.rows[i].cells[0].innerText = i + 1;
            }
        }

        function calculateTotal() {
            var table = document.getElementById('billItems');
            var grandTotal = 0;
            for (var i = 0; i < table.rows.length; i++) {
                var row = table.rows[i];
                var qty = parseFloat(row.querySelector('.qty').value) || 0;
                var rate = parseFloat(row.querySelector('.rate').value) || 0;
                var total = qty * rate;
                row.querySelector('.item-total').innerText = total.toFixed(2);
                grandTotal += total;
            }
            document.getElementById('grandTotal').innerText = grandTotal.toFixed(2);
        }
    </script>
</body>
</html>
