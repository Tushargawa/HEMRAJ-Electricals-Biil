<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hemraj Electricals - Billing</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #2d2d2d; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 360px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center; }
        .login-card h2 { color: #b30000; margin-bottom: 8px; }
        .login-card p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; outline: none; }
        .login-btn { width: 100%; padding: 12px; background: #b30000; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .login-btn:active { background: #800000; }
        .error-msg { color: red; margin-top: 10px; font-size: 14px; display: none; }
        #billingApp { display: none; background: white; width: 100%; min-height: 100vh; padding: 20px; }
    </style>
</head>
<body>

    <!-- Login Container -->
    <div class="login-card" id="loginBox">
        <h2>Hemraj Electricals</h2>
        <p>Please login to access billing</p>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <input type="text" id="usernameInput" placeholder="Username" required autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="Password" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
            <div id="errorText" class="error-msg">युजरनेम किंवा पासवर्ड चुकीचा आहे!</div>
        </form>
    </div>

    <!-- Main Billing App Container -->
    <div id="billingApp">
        <h1>Hemraj Electricals Billing App</h1>
        <p>लॉगिन यशस्वी झाले आहे!</p>
        <!-- तुमचे बिलिंगचे पूर्ण टेबल आणि कोड इथे दिसेल -->
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault(); // फॉर्म रीलोड होण्यापासून रोखते
            
            var user = document.getElementById('usernameInput').value.trim();
            var pass = document.getElementById('passwordInput').value.trim();
            var errorDiv = document.getElementById('errorText');

            // Username: HE आणि Password: hemrajele
            if (user === "HE" && pass === "hemrajele") {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('billingApp').style.display = 'block';
                errorDiv.style.display = 'none';
            } else {
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
